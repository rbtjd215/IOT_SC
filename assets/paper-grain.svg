<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <filter id="paper" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.48" numOctaves="3" seed="18" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="3.2" intercept="-1.1"/>
      <feFuncG type="linear" slope="3.2" intercept="-1.1"/>
      <feFuncB type="linear" slope="3.2" intercept="-1.1"/>
    </feComponentTransfer>
  </filter>
  <rect width="320" height="320" filter="url(#paper)"/>
</svg>
